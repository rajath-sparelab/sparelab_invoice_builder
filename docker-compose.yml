services:
  postgres:
    image: postgres:16-alpine
    container_name: document-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: document_builder
      POSTGRES_USER: document_builder
      POSTGRES_PASSWORD: document_builder_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_builder -d document_builder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
